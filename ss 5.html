
<!DOCTYPE html>
<html>
<head>
    <title>Hitung Total Belanja</title>
</head>
<body>

<script>
    let harga = Number(prompt("Masukkan harga: "));
    let jumlah = Number(prompt("Masukkan jumlah: "));

    let total = harga * jumlah;

    console.log("Harga = Rp " + harga);
    console.log("Jumlah = " + jumlah);
    console.log("Total belanja = Rp " + total);
</script>

</body>
</html>
