
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Typeof</title>
</head>
<body>

    <h1>Belajar JavaScript</h1>
    <p>Cek tipe data menggunakan typeof</p>

    <script>
        let nama = "Asep";
        let umur = 16;

        console.log(typeof nama);
        console.log(typeof umur);
    </script>

</body>
</html>
